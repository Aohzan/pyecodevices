[project]
name = "pyecodevices"
version = "1.7.0"
description = "Get information from GCE Eco-Devices."
authors = [{ name = "Aohzan", email = "aohzan@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.10.0",
    "async-timeout>=4.0.0",
    "xmltodict>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/aohzan/pyecodevices"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["pyecodevices*"]

[tool.semantic_release]
# Existing release tags have no "v" prefix
tag_format = "{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
    pip install uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.changelog]
default_templates = { changelog_file = "CHANGELOG.md" }
exclude_commit_patterns = [
    "^chore\\(deps",
]
